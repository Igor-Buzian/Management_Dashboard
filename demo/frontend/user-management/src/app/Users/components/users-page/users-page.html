<app-sidebar (action)="onSidebarAction($event)"></app-sidebar>
<app-users-search (search)="onSearch($event)"></app-users-search>

<app-users-list
  [users]="users()"
  (edit)="openEdit($event)"
  (delete)="delete($event)">
</app-users-list>


@if (selectedUser) {
  <app-user-form-modal
    [user]="selectedUser"
    (save)="save($event)"
    (cancel)="closeModal()">
  </app-user-form-modal>
}
